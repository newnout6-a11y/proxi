name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # The relay is Windows-first (allowlisted powershell/cmd commands, cp866
    # decoding, taskkill process-tree cleanup), so run the offline suite there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # Only the bug-class rules of ruff.toml (unused or undefined names, bugbear); the code is not reformatted.
      - name: Lint
        run: |
          python -m pip install ruff==0.15.13
          ruff check .
      - name: Run offline test suite
        run: python -m pytest tests -q
      - name: Run OpenCode label plugin tests
        run: node --test tests/test_opencode_labels.mjs
      # Every unit test file of the admin UI (npm run test:unit runs the same set): the trace model and the Prompts screen.
      - name: Run admin UI unit tests
        run: node --test web/tests/turns.test.mjs web/tests/prompts.test.mjs

  admin-ui:
    # web/dist is committed and served as is, so CI rebuilds it and fails on drift. The browser
    # scenarios and the rendered design gate use synthetic API fixtures only: no relay, no Retool.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install admin UI dependencies
        run: npm ci
      - name: Build admin UI
        run: npm run build
      - name: Check web/dist is up to date
        run: |
          $drift = git status --porcelain -- dist
          if ($drift) {
            $drift | Write-Host
            Write-Host "::error::web/dist differs from a fresh build. Run 'npm ci; npm run build' in web/ and commit web/dist."
            exit 1
          }
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      # Traces and screenshots go below the temp dir; point it at a path the artifact step knows.
      - name: Run admin UI browser tests
        env:
          TEMP: ${{ runner.temp }}
        run: npx playwright test --reporter=line
      - name: Run rendered design gate (axe and overflow)
        env:
          TEMP: ${{ runner.temp }}
        run: npm run test:design
      - name: Keep browser traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-evidence
          path: |
            ${{ runner.temp }}/relay-admin-playwright
            ${{ runner.temp }}/proxi-design-qa
          if-no-files-found: ignore
